[project]
name = "prepwise-backend"
version = "0.1.0"
description = "PrepWise API (Django REST Framework)"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.18",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "psycopg[binary]==3.3.6",
    "whitenoise==6.12.0",
    "openai==3.29.0",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "razorpay==2.0.1",
    "pypdf==6.21.2",
    "defusedxml==0.7.1",
    "fpdf2==2.8.9",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --reuse-db"
testpaths = ["common", "apps", "config"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S105", "S106", "S107"]
"conftest.py" = ["S105"]
"config/settings/*" = ["S105"]
